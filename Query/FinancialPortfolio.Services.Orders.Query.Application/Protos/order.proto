syntax = "proto3";

package OrderApi;

service Order {
  rpc GetAll (GetOrdersRequest) returns (OrdersResponse) {}
}

message GetOrdersRequest {
}

message OrdersResponse {
  repeated OrderResponse orders = 1;
}

message OrderResponse {
  string id = 1;
  OrderType type = 2;
  double amount = 3;
  double price = 4;
  string dateTime = 5;
  double commission = 6;
  string assetId = 7;
  string accountId = 8;
}

enum OrderType {
  Buy = 0;
  Sell = 1;
}